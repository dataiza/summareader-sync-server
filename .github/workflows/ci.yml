name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      # Includes the concurrency test that the sequence counter exists for,
      # run repeatedly because a race that passes once has proved nothing.
      - name: Test
        run: go test -race -count=3 ./...

      # The release cross-compiles five targets from this same Linux runner,
      # so a break on macOS or Windows was found at tag time rather than on
      # the pull request that caused it. No cgo and no build tags means the
      # compiler is the whole check, and it costs seconds on a runner that is
      # already warm — the platform-specific code is one switch on
      # `runtime.GOOS` in main.go choosing the data directory.
      - name: It still builds for the other two
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Dependencies
        working-directory: console
        run: flutter pub get

      - name: Analyze
        working-directory: console
        run: flutter analyze

      - name: Formatting
        working-directory: console
        run: dart format --set-exit-if-changed lib test

      # Without the golden. That one compares pixels, and text rendering
      # differs between the machine that drew the picture and this one — the
      # screenshot is regenerated by whoever changes the window, and reviewed
      # in the diff. The drift check against the app's UI package skips here
      # for the same kind of reason: this box has only this repository.
      - name: Test
        working-directory: console
        run: flutter test --exclude-tags golden
