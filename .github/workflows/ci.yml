name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      # Includes the concurrency test that the sequence counter exists for,
      # run repeatedly because a race that passes once has proved nothing.
      - name: Test
        run: go test -race -count=3 ./...
