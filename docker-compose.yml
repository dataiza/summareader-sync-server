# A self-hosted SummaReader sync server.
#
#   docker compose up -d
#   docker compose exec sync summareader-sync first-device "My library" "Desktop" --dir=/data
#
# The second command prints a token once. Paste it into SummaReader on that
# device; every device after it is enrolled from one already paired, with no
# shell involved.

services:
  sync:
    build: .
    image: summareader-sync:local
    restart: unless-stopped

    ports:
      # One interface, named, rather than localhost or everything.
      #
      # Localhost is unreachable from another container and from any other
      # device, which is what the MCP mirror and a phone both need. `0.0.0.0`
      # is the usual next step and offers this on every interface the machine
      # has — here that is a second LAN, a Kubernetes management network and
      # two Docker bridges, none of which asked for it.
      #
      # So: loopback, which is what the app on this machine already points at
      # and must keep working, plus the one address that is supposed to reach
      # it from elsewhere. Override the second with SYNC_BIND; drop it
      # entirely to go back to a machine that syncs only with itself.
      #
      # It is still plain HTTP carrying device tokens, and this puts them on a
      # LAN rather than a loopback. That is a real change and worth meaning:
      # on a network you control it is the ordinary way to sync a phone, and
      # anywhere less private it wants a TLS terminator in front and
      # `127.0.0.1:8099:8099` here again.
      #
      # The port is a variable because the desktop window can install a
      # systemd unit that runs this file, and the address chosen in that
      # window has to be able to reach the container. Inside it is always
      # 8099 — that is what the image serves on.
      - "127.0.0.1:${SYNC_PORT:-8099}:8099"
      - "${SYNC_BIND:-10.10.20.1}:${SYNC_PORT:-8099}:8099"

    environment:
      # Off unless something sets it, exactly as outside Docker: the endpoint
      # 404s without a token. The desktop window sets it in the unit it writes,
      # so its status pane can read the counts out of a container it started.
      SUMMAREADER_METRICS_TOKEN: "${SUMMAREADER_METRICS_TOKEN:-}"

    # The container writes as whoever owns ./pb_data, so the same database
    # works whether the server is run in Docker or straight from the host.
    # Override when that is not this user.
    user: "${SYNC_UID:-1000}:${SYNC_GID:-1000}"

    volumes:
      # Everything worth keeping. Losing this is losing the sync history —
      # not the libraries themselves, which live on the devices, but every
      # device's token and the account they share.
      #
      # A directory rather than a named volume, and deliberately: the native
      # path serves ./pb_data, so a volume here means two databases, one
      # empty, and a server that answers correctly while knowing nothing —
      # every device unenrolled, with no error to say why.
      - ./pb_data:/data

    healthcheck:
      # /instance needs no token, which is what makes it usable here: it is
      # the endpoint a client calls to tell "wrong URL" from "right URL, no
      # data", and it answers exactly when the server is able to answer.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/instance"]
      interval: 30s
      timeout: 5s
      # Generous, because the first start creates the database and runs the
      # schema migration before anything answers.
      start_period: 30s
      retries: 3

    # The server holds ciphertext and needs no privileges to do it.
    security_opt:
      - no-new-privileges:true

