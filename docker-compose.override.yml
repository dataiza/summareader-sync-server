# Serves the database that is already here, rather than a fresh volume.
#
# The account and every device token live in ./pb_data. Without this, the
# container starts on an empty `sync-data` volume — a server that answers
# perfectly well and knows none of your devices, which is a confusing way to
# discover that they are two different deployments.
#
# Compose reads this file automatically when it sits beside docker-compose.yml.
# Delete it to go back to the named volume.
services:
  sync:
    volumes:
      - ./pb_data:/data
    # As whoever owns pb_data. The image's own user is uid 10001, which owns
    # the named volume it normally gets and nothing on this host — against a
    # bind mount that is "attempt to write a readonly database", which is a
    # permission error wearing a very misleading sentence.
    user: "1000:1000"
