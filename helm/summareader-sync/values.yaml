image:
  repository: 10.34.1.1:30095/summareader-sync
  tag: ""  # empty means the chart's appVersion

# The server announces itself over mDNS, which only leaves a pod that shares the node's network.
# true: announce the LoadBalancer IP (service.loadBalancerIP), and the namespace must allow hostNetwork
# (pod-security "privileged"); with no loadBalancerIP the pod announces the node's own address. false: no announcement; devices use the address typed or scanned.
hostNetwork: true

service:
  port: 443  # what devices use, so the address has no port; 8099 is exposed as well, for the mDNS announcement
  loadBalancerIP: ""  # rendered as the Cilium LB-IPAM annotation; also what is announced over mDNS
  labels: {}  # extra Service labels; Cilium LB-IPAM pools select Services by label, so loadBalancerIP stays pending without the pool's label
  hostname: summareader-sync  # rendered as the k8s-gateway DNS name
  annotations: {}  # extra Service annotations, e.g. how an ingress controller reaches the pod over HTTPS (pairIngress)

# The /pair page behind an Ingress with a public certificate (cert-manager), for a browser without a warning.
# Only the page: devices keep syncing to publicURL and the server's own pinned certificate. The controller must
# reach the pod over HTTPS without verifying it (the certificate is self-signed); for Traefik that is the
# serversscheme and serverstransport annotations under service.annotations, and a ServersTransport.
# The operator token is the only thing between this host and a new device token: keep the host LAN-only, or
# restrict it (an IP allow-list or rate-limit middleware through pairIngress.annotations).
pairIngress:
  enabled: false
  host: ""  # required when enabled, e.g. summareader-pair.example; publicURL is then required too
  className: ""  # empty means the cluster's default IngressClass
  clusterIssuer: ""  # rendered as cert-manager.io/cluster-issuer
  annotations: {}

publicURL: ""  # the address a pairing QR carries, e.g. https://summareader-sync.example; empty means the request's Host

name: ""  # SUMMAREADER_NAME, what devices discover; empty leaves PocketBase's default, "Acme"

operatorToken:
  secretName: ""  # required, an existing Secret with key operator-token; the chart never creates one. It is the /pair password.

metricsToken:
  secretName: ""  # optional, an existing Secret with key metrics-token; empty leaves /metrics off

persistence:
  size: 1Gi  # the database; the only thing worth backing up
  storageClass: ""  # empty means the cluster default

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
