apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "summareader-sync.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.service.loadBalancerIP }}
    lbipam.cilium.io/ips: {{ . }}
    {{- end }}
    coredns.io/hostname: {{ .Values.service.hostname }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  selector:
    {{- include "summareader-sync.selector" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
    # The mDNS announcement advertises the server's own port, so 8099 stays reachable on the LB IP too.
    - name: https-alt
      port: 8099
      targetPort: https
