{{- if .Values.pairIngress.enabled }}
# The pairing page behind an Ingress with a public certificate, so a browser shows a padlock instead of a warning.
#
# Only the page and the one route it calls. Devices pin the server's own certificate (card 713), and a renewed public
# certificate would change under every one of them every few months, so sync never goes through here: the QR this
# page draws names publicURL, which is the LoadBalancer address and the server's own certificate.
{{- $publicURL := required "publicURL is required with pairIngress: the QR must name the sync address, not this page's host" .Values.publicURL }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-pair
  labels:
    {{- include "summareader-sync.labels" . | nindent 4 }}
  {{- if or .Values.pairIngress.clusterIssuer .Values.pairIngress.annotations }}
  annotations:
    {{- with .Values.pairIngress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with .Values.pairIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.pairIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "pairIngress.host is required" .Values.pairIngress.host }}
      secretName: {{ .Chart.Name }}-pair-tls
  rules:
    - host: {{ .Values.pairIngress.host }}
      http:
        paths:
          {{- range list "/pair" "/operator/pairing" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Chart.Name }}
                port:
                  name: https
          {{- end }}
{{- end }}
